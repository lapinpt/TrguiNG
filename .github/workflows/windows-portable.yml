name: Windows Portable

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: 'Optional: revalidate an existing build when only CI scripts changed'
        required: false
        default: ''
  push:
    branches: [portable-windows]

permissions:
  contents: read
  actions: read

concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - name: Test portable storage on Windows
        shell: pwsh
        run: |
          rustc --edition 2021 --test src-tauri/src/storage.rs -o "$env:RUNNER_TEMP/storage-tests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/storage-tests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fetch pinned GeoIP database
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/openscopeproject/TrguiNG/releases/download/v1.5.1/dbip.mmdb' -OutFile src-tauri/dbip.mmdb
          $hash = (Get-FileHash src-tauri/dbip.mmdb -Algorithm SHA256).Hash
          if ($hash -ne 'e4f183d26a79e7750abb24cce0dcc595a0cb009f2de4082c27b84cae6bbd7944') { throw 'GeoIP checksum mismatch' }
      - name: Test settings migration
        shell: pwsh
        run: ./ci/test_portable_import.ps1
      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check frontend
        run: npx --no-install eslint src/
      - name: Compile Windows executable
        if: inputs.candidate_run_id == ''
        run: npm run tauri -- build --no-bundle --ci -- --locked
      - name: Package portable ZIP
        if: inputs.candidate_run_id == ''
        shell: pwsh
        run: ./ci/package_windows_portable.ps1
      - name: Reuse unchanged application build
        if: inputs.candidate_run_id != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          if ($env:CANDIDATE_RUN_ID -notmatch '^\d+$') { throw 'Invalid candidate run ID' }
          gh run download $env:CANDIDATE_RUN_ID --repo $env:GITHUB_REPOSITORY --name TrguiNG-portable-build-candidate --dir portable-output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $zip = Get-ChildItem portable-output/*.zip | Select-Object -First 1
          $expected = (Get-Content ($zip.FullName + '.sha256')).Split(' ')[0]
          if ((Get-FileHash $zip.FullName -Algorithm SHA256).Hash -ne $expected) { throw 'Candidate checksum mismatch' }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath portable-output
          $info = Get-ChildItem portable-output -Filter BUILD-INFO.txt -Recurse | Select-Object -First 1
          $commit = ((Get-Content $info.FullName | Where-Object { $_ -like 'Commit: *' }).Substring(8)).Trim()
          if ($commit -notmatch '^[0-9a-f]{40}$') { throw 'Invalid candidate source commit' }
          git diff --quiet $commit HEAD -- src src-tauri package.json package-lock.json webpack.common.mjs webpack.prod.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Application sources differ; a fresh build is required' }
          Write-Host "Revalidating unchanged application binary from commit $commit"
      - name: Preserve build candidate for diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TrguiNG-portable-build-candidate
          path: |
            portable-output/*.zip
            portable-output/*.sha256
          if-no-files-found: error
      - name: Smoke test portable Windows application
        shell: pwsh
        run: ./ci/smoke_windows_portable.ps1
      - name: Preserve smoke test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portable-smoke-diagnostics
          path: portable-output/smoke-diagnostics/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TrguiNG-portable-windows-x64
          path: |
            portable-output/*.zip
            portable-output/*.sha256
          if-no-files-found: error
